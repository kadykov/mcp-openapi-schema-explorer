version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      # Keep the TypeScript toolchain in a dedicated batch so it can be updated
      # together without conflicting with the rest of the dev dependencies.
      typescript-dependencies:
        patterns:
          - 'typescript'
          - '@typescript-eslint/*'
          - '@types/*'
          - 'ts-jest'

      # Keep everything else in the development toolchain separate.
      dev-dependencies:
        dependency-type: 'development'
        exclude-patterns:
          - 'typescript'
          - '@typescript-eslint/*'
          - '@types/*'
          - 'ts-jest'

      # Group production dependencies together.
      production-dependencies:
        dependency-type: 'production'

  - package-ecosystem: 'docker'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    open-pull-requests-limit: 10
    groups:
      github-actions:
        patterns:
          - '*'
